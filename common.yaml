version: "2.4"

services:
  odoo:
    build:
      context: ./odoo
      args:
        ODOO_VERSION: "8.0"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        GIT_TOKEN: ${GIT_TOKEN}
        GITLAB_TOKEN: ${GITLAB_TOKEN}
    environment:
      EMAIL_FROM: ""
      PGDATABASE: &dbname prod
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "false"
      LIST_DB: "true"
      WORKERS: "${WORKERS-0}"
      MAX_CRON_THREADS: "${MAX_CRON_THREADS-0}"
      LIMIT_MEMORY_HARD: "${LIMIT_MEMORY_HARD-2684354560}"
      LIMIT_MEMORY_SOFT: "${LIMIT_MEMORY_SOFT-2147483648}"
      SERVER_WIDE_MODULES: "${SERVER_WIDE_MODULES-base,web}"
    tty: true
    volumes:
      - filestore:/var/lib/odoo:z
      - files_electronic:/opt/odoo8/files_electronics

  db:
    image: ghcr.io/tecnativa/postgres-autoconf:9.6-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      CONF_EXTRA: |
        work_mem = 512MB
        max_wal_size = 4GB
    volumes:
      - db:/var/lib/postgresql/data:z

  smtpfake:
    image: docker.io/mailhog/mailhog
