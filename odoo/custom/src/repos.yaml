# See https://github.com/Tecnativa/doodba#optodoocustomsrcreposyaml
./odoo:
  defaults:
    # Shallow repositories ($DEPTH_DEFAULT=1) are faster & thinner
    # You may need a bigger depth when merging PRs (use $DEPTH_MERGE
    # for a sane value of 100 commits)
    depth: $DEPTH_DEFAULT
  remotes:
    #origin: https://github.com/odoo/odoo.git
    origin: https://oauth2:$GITLAB_TOKEN@gitlab.com/trilambda/odoo_dev.git
  target: origin $ODOO_VERSION
  merges:
    - origin $ODOO_VERSION
    # Example of a merge of the PR with the number <PR>
    # - oca refs/pull/<PR>/head
./ecua_contabilidad:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://oauth2:$GITLAB_TOKEN@gitlab.com/trilambda/ecua_contabilidad.git
  target: origin $ODOO_VERSION
  merges:
    - origin 72042c18592e92687c7ea643b2b19b9e919ffca9
    - origin 8.0-jasper

